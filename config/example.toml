# aki configuration. Every value below is the default: delete what you
# do not change. Unknown keys are errors, so a typo never goes unnoticed.

# How often the board looks again, in seconds (minimum 5).
refresh_seconds = 30

# Desktop notification when something new becomes yours while watching.
notifications = true

# `aki list` reuses a reading younger than this instead of asking the
# sources again (0: always ask; `--fresh` asks once). The live board always
# asks, and shows the last reading while the first one is under way.
cache_seconds = 60

# ── Sources ────────────────────────────────────────────────────────────
# Without any [[sources]], aki uses gitlab.com when `glab` is installed
# and github.com when `gh` is installed, with their own logins.
#
# [[sources]]
# kind = "gitlab"
# name = "gitlab"               # shown on the board; defaults to the kind
# host = "gitlab.com"
# token_env = "GITLAB_TOKEN"    # read first, when set
# token_command = "glab config get token --host gitlab.com"
# token_renew_command = "glab api user --hostname gitlab.com"  # run when the token is refused
#
# [[sources]]
# kind = "github"
# host = "github.com"
#
# [[sources]]
# kind = "jira"
# site = "https://your-company.atlassian.net"
# email = "you@your-company.com"
# token_env = "JIRA_API_TOKEN"  # https://id.atlassian.com/manage-profile/security/api-tokens
# # token_command = "security find-generic-password -s aki-jira -w"
# jql = "assignee = currentUser() AND statusCategory != Done ORDER BY updated DESC"

# ── Review threads ─────────────────────────────────────────────────────
[threads]
# Who closes a thread once it is answered:
#   "reviewer"  whoever opened it checks the answer and resolves it
#   "author"    the author resolves threads once addressed
#   "anyone"    no convention; only "who spoke last" counts
who_resolves = "reviewer"
# Comments from bots never put the ball in anyone's court.
ignore_bots = true

# ── Drafts ─────────────────────────────────────────────────────────────
[drafts]
# Your own drafts:
#   "todo"    with everything else that waits on you
#   "apart"   on the board, but only in the panes that ask for drafts (a pane
#             filtered on is:draft): not in "to do", not counted, not announced
#   "ignore"  left off the board until they are ready
mine = "todo"
# Someone else's draft you are a reviewer of:
#   "wait"    listed as waiting on its author
#   "review"  treated like any other review
#   "ignore"  left off the board
others = "wait"

# ── Re-reviews ─────────────────────────────────────────────────────────
[re_review]
# Any of these makes a re-review due after your first pass:
#   "author_replied"        someone answered in a thread you take part in
#   "new_commits"           commits were pushed after your last review activity
#   "re_requested"          your review was requested again
#   "approval_reset"        your approval was reset or dismissed
#   "all_threads_answered"  every thread you opened is answered or resolved
triggers = ["author_replied", "new_commits", "re_requested", "approval_reset"]
# Whether something you already approved can come back for a re-review.
after_approval = false

# ── Tickets ────────────────────────────────────────────────────────────
[tickets]
# Statuses that mean "not yours to move right now" (case-insensitive).
waiting_statuses = ["blocked", "on hold", "in review", "waiting"]

# ── Nudges ─────────────────────────────────────────────────────────────
[nudge]
# A waiting item nobody touched for this many days becomes a "nudge" to do.
# 0 disables nudges.
after_days = 0

# ── Urgency ────────────────────────────────────────────────────────────
# Every task gets a score, and panes put the highest first by default:
#   (100 - the rule's priority) + waiting + ticket
[urgency]
# Waiting: points per full day since the ball arrived, up to a cap.
per_day = 3
waiting_cap = 60
# Ticket: a change that names a ticket (PROJ-12 in its title or branch)
# gets `linked`, plus the points of the ticket's priority when a tracker
# can tell it. A ticket gets the points of its own priority.
linked = 5
highest = 50
high = 30
medium = 10
low = 0
lowest = -10
# From these scores on, a task is marked warm (▴), then hot (▲).
warm = 100
hot = 130

# ── Sounds ─────────────────────────────────────────────────────────────
# While the board is open, something new to do rings: once per refresh,
# with the sound of the most pressing new task.
[sounds]
enabled = true
# A system sound by name (`aki sounds` lists them, `aki sounds NAME`
# plays one), or a file of your own: "~/sounds/ding.wav". The default is
# "Glass" on macOS and "message-new-instant" elsewhere.
# new_task = "Glass"
#
# A sound of its own for a rule; "none" keeps it quiet.
# [sounds.rules]
# review_requested = "Ping"
# reply_needed = "Pop"
# draft_to_finish = "none"

# ── Agents ─────────────────────────────────────────────────────────────
# `a` on a task (or `aki agent REF`) opens your coding agent on it, in
# the repository's clone, already told what there is to do.
[agent]
# The agent's command. {prompt} is where the brief goes, as one argument;
# without it the brief is the last argument. A list works too:
# ["claude", "--model", "opus", "{prompt}"].
command = "claude {prompt}"
# Added at the end of every brief: how you want your agent to work.
instructions = ""
# Where the agent opens:
#   "auto"      Herdr when aki runs inside it, else the terminal itself,
#               else (no terminal at all) a Claude conversation
#   "herdr"     a Herdr workspace per repository, a tab per piece of work.
#               A tab already open is used again: its agent is told the new
#               brief, or started in it if it is not running
#   "terminal"  a new window or tab of tmux, Ghostty, WezTerm, kitty, iTerm
#               or Terminal, whichever aki runs in
#   "claude"    no terminal: a new Claude conversation, started on the brief
launcher = "auto"
# The address a conversation opens at with launcher = "claude". {prompt} is
# the brief. For the desktop app: "claude://claude.ai/new?q={prompt}".
chat_url = "https://claude.ai/new?q={prompt}"
# The names. {repo} the repository's name, {path} its full path, {ref} the
# reference (!916, #12, PROJ-7), {short} both (web!916), {ticket} the ticket
# the change names, {kind} the rule that lists it, {source} where it is from.
workspace = "{repo}"
tab = "{ticket} {ref}"
# Whether opening an agent takes you to it.
focus = true
# For a terminal aki does not know: your own command to open a window.
# {command} is what to run, {title} its name, {directory} where it starts.
# terminal = ["alacritty", "--title", "{title}", "-e", "{command}"]
# A named Herdr session to open agents in, instead of the current one.
# herdr_session = "work"
# Where your clones are looked for (matched by their git remote). Without
# it: ~/code, ~/src, ~/dev, ~/projects, ~/work, ~/repos, ~/git, ~/Developer
# and ~/Desktop, whichever exist.
# roots = ["~/code"]
#
# A clone that lives somewhere else:
# [agent.repos]
# "group/project" = "~/elsewhere/project"

# ── Assistants ─────────────────────────────────────────────────────────
# `aki mcp` serves the board to an assistant (Claude Desktop, Claude
# Code…) over the Model Context Protocol; `aki mcp setup` says how to
# plug it in. Reading the board is always allowed; the rest is yours to say.
[mcp]
enabled = true
# May it set tasks aside and bring them back?
set_aside = true
# May it open your agent on a task?
start_agent = true

# ── Rules ──────────────────────────────────────────────────────────────
# Every reason an item can be on the board is a rule. Each one can be
# disabled, moved to the other list ("todo" or "waiting"), or reprioritized
# (lower comes first). `aki rules` prints them all as they apply.
#
# To do:    review_requested re_review reply_needed ticket_mentioned
#           thread_to_resolve checks_failed conflicts rebase ready_to_merge assigned
#           no_reviewer ticket_in_progress ticket_todo nudge draft_to_finish
# Waiting:  awaiting_review awaiting_author awaiting_reply checks_running
#           ticket_blocked draft_by_other
#
# [rules.draft_to_finish]
# enabled = false
#
# [rules.checks_running]
# bucket = "todo"
# priority = 45
